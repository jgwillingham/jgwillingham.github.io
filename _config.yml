# Site identity: edit these to change the name, tagline and links shown site-wide.
title: George Willingham
tagline: ML | DSP | Physics
description: >-
  R&D engineer with a background in condensed matter physics, specializing in machine learning and signal processing.
  On this site, I share research, projects, and notes on a wide range of topics.
url: https://jgwillingham.github.io
baseurl: ""
lang: en

# Contact links. Leave a value empty ("") to hide it.
social:
  github: jgwillingham
  linkedin: "https://www.linkedin.com/in/george-willingham-46b23797/"
  email: ""

# Notes: PDFs are compiled and hosted by the separate notes repo's GitHub Pages site.
# The list of notes shown on /notes/ lives in _data/notes.yml.
notes:
  pdf_url: https://jgwillingham.github.io/latex-notes
  source_url: "" #https://github.com/jgwillingham/latex-notes   # "" hides "LaTeX source" links

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: pages
    values:
      layout: page

markdown: kramdown
kramdown:
  input: GFM   # $$...$$ math is converted to \( \) / \[ \] for MathJax

sass:
  style: compressed

plugins:
  - jekyll-redirect-from

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - "*.drawio"
  - vendor
