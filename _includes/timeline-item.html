{%- assign e = include.entry -%}
{%- if e.kind == "milestone" %}
<li class="timeline__item timeline__item--milestone">
  <span class="timeline__year">{{ e.year }}</span>
  <p>{{ e.text }}</p>
</li>
{%- else %}
<li class="timeline__item">
  <span class="timeline__year">{{ e.year }}</span>
  <p class="timeline__role">{{ e.role }}</p>
  <p class="timeline__org">{{ e.org }}</p>
  {%- if e.tags %}
  <ul class="tags">
    {%- for tag in e.tags %}
    <li>{{ tag }}</li>
    {%- endfor %}
  </ul>
  {%- endif %}
</li>
{%- endif %}
