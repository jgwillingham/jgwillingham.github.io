{%- assign note_count = site.data.notes.size | default: 0 -%}
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}">GW</a>
    <nav aria-label="Main">
      <ul class="site-nav">
        {%- for link in site.data.navigation %}
        {%- if link.requires_notes and note_count == 0 %}{% continue %}{% endif %}
        {%- assign current = page.url | slice: 0, link.url.size %}
        <li><a href="{{ link.url | relative_url }}"{% if current == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
