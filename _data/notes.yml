# Notes listed on /notes/ (shown in this order, as a flat searchable list).
# The Notes nav link appears automatically once at least one note is listed.
#
# Each note:
#   title:       shown as the link text
#   path:        the note's folder name under notes/ in the notes repo; the PDF is <pdf_url>/<path>.pdf
#   description: one or two sentences
#   tags:        list of tags (subject, topics, ...); shown as chips, searchable, click to filter
#   status:      optional; "draft" shows an "In progress" badge
#
# Example:
#   - title: Linear Algebra
#     path: linear_algebra
#     description: Vector spaces, linear maps and spectral theory, with physics applications.
#     tags: [Mathematics, Eigenvalues]
#     status: draft

